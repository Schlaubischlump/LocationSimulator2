services:
  site:
    image: ruby:3.3
    working_dir: /site
    command: sh -c "bundle config set path /bundle && bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 4000 --livereload --force_polling --baseurl ''"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - bundle:/bundle

volumes:
  bundle:

