site:
  issues_url: https://github.com/Schlaubischlump/LocationSimulator2/issues/new/choose
  legacy_url: https://schlaubischlump.github.io/LocationSimulator/
  contact_email: locationsimulator@icloud.com

locationsimulator:
  name: LocationSimulator
  eyebrow: iOS, iPadOS, and Mac
  description: Choose locations and routes for physical iPhones and iPads or devices running in iOS Simulator. Connects to LocationSpoofer, which must be running on a Mac.
  changelog_label: LocationSimulator

locationspoofer:
  name: LocationSpoofer
  eyebrow: Required helper app
  description: Runs on your Mac and handles communication with physical devices and iOS Simulator.
  changelog_label: LocationSpoofer
